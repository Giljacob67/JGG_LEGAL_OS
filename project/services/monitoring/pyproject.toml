[project]
name = "jgg-monitoring"
version = "0.1.0"
description = "JGG Legal OS — Serviço de monitoramento processual"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "beautifulsoup4>=4.13",
    "lxml>=5.3",
    "asyncpg>=0.30",
    "redis>=5.2",
    "minio>=7.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "apscheduler>=3.10,<4.0",
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "cryptography>=44",
    "python-json-logger>=3.2",
    "tenacity>=9.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
    "respx>=0.21",
    "factory-boy>=3.3",
]
playwright = [
    "playwright>=1.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
